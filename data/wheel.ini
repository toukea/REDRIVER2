# G29 starting profile. Run calibrate-wheel.cmd to verify your actual driver mapping.
# Axes/buttons are ZERO BASED. These defaults are not a hardware certification.
[wheel]
enabled=1
# -1 selects a G29/G920/G923 by name; the other groups share that wheel.
device=-1
pedals_device=-1
shifter_device=-1
handbrake_device=-1
steering_axis=0
throttle_axis=2
brake_axis=3
clutch_axis=1
handbrake_axis=-1
throttle_invert=1
brake_invert=1
clutch_invert=1
steering_deadzone=0.002
throttle_deadzone=0.015
brake_deadzone=0.015
clutch_deadzone=0.015
gear1_button=12
gear2_button=13
gear3_button=14
gear4_button=15
gear5_button=16
gear6_button=17
handbrake_button=2
# Match hardware_rotation to the range configured in the wheel driver.
# rotation is the desired game range; smaller values add a software soft stop.
hardware_rotation=900
rotation=900
steering_lock=35
# Moderate initial force. Direction must be checked on the real wheel.
ffb_gain=0.35
ffb_damping=0.08
ffb_road=0.12
ffb_filter=0.35
ffb_invert=0
# Manual by default. Set 1 (or A in calibration) for assisted clutch.
assisted_clutch=0
clutch_bite=0.65
idle_rpm=850
redline_rpm=6500
final_drive=3.7
tyre_radius=0.34
ratio0=3.3
ratio1=3.3
ratio2=2.1
ratio3=1.5
ratio4=1.15
ratio5=0.9
driver_burnout=1
