; =====================================================================
; REDRIVER2 - configuration du volant (Logitech G29 et compatibles)
; Les lignes commencant par ; sont des commentaires.
; Le fichier est relu pendant le jeu : une modification est appliquee
; en moins d'une seconde. WheelConfig (touche S) le reecrit avec ces
; commentaires et garde la version precedente dans wheel.ini.bak.
; Les valeurs hors plage sont ramenees dans la plage indiquee.
; =====================================================================
[wheel]

; Support du volant : 1 = actif, 0 = desactive (manette seule).
enabled=1

; ---------------------------------------------------------------------
; PERIPHERIQUES
; Volant, pedalier, shifter et frein a main peuvent etre des appareils
; distincts. Le GUID est prioritaire : s'il est renseigne, l'index est
; ignore. Index -1 sans GUID : le volant cherche un G29/G920/G923, les
; autres groupes reprennent l'appareil du volant.
; ---------------------------------------------------------------------
; Volant (direction et retour de force) : index SDL de l'appareil.
device=-1
; GUID SDL de cet appareil (rempli par WheelConfig ; vide = utiliser l'index).
guid=
; Pedalier : index SDL. Les trois pedales doivent etre sur cet appareil.
pedals_device=-1
; GUID SDL de cet appareil (rempli par WheelConfig ; vide = utiliser l'index).
pedals_guid=
; Shifter (boite en H) : index SDL.
shifter_device=-1
; GUID SDL de cet appareil (rempli par WheelConfig ; vide = utiliser l'index).
shifter_guid=
; Frein a main USB : index SDL.
handbrake_device=1
; GUID SDL de cet appareil (rempli par WheelConfig ; vide = utiliser l'index).
handbrake_guid=03008d9a6d04000019c2000000000000

; ---------------------------------------------------------------------
; AXES
; Valeurs brutes SDL sur 16 bits (-32768 a 32767), mesurees par la
; calibration de WheelConfig (touche C). Mesures G29/G HUB : volant 0,
; accelerateur 1, frein 2, embrayage 3.
; ---------------------------------------------------------------------
; --- Direction (volant) ---
; Numero d'axe SDL, a partir de 0 (-1 = non affecte).
steering_axis=0
; Valeur brute a une butee (pedale : repos ou enfoncee selon l'appareil).
steering_min=-32768
; Valeur brute volant droit.
steering_center=0
; Valeur brute a l'autre butee.
steering_max=32767
; 1 = inverser le sens de la direction.
steering_invert=0
; Zone morte : part de la course ignoree (0 a 0.4).
steering_deadzone=0.002000
; Courbe de reponse : 1 = lineaire, >1 = plus doux au debut, <1 = plus vif (0.2 a 5).
steering_gamma=1.000000

; --- Accelerateur ---
; Numero d'axe SDL, a partir de 0 (-1 = non affecte).
throttle_axis=1
; Valeur brute a une butee (pedale : repos ou enfoncee selon l'appareil).
throttle_min=-32768
; Valeur brute au centre : ignoree pour une pedale.
throttle_center=0
; Valeur brute a l'autre butee.
throttle_max=32767
; 1 = inverser le sens (pedales G29 : 1, elles valent 32767 au repos).
throttle_invert=1
; Zone morte : part de la course ignoree (0 a 0.4).
throttle_deadzone=0.015000
; Courbe de reponse : 1 = lineaire, >1 = plus doux au debut, <1 = plus vif (0.2 a 5).
throttle_gamma=1.000000

; --- Frein (une pression a fond peut bloquer les roues : pas d'ABS) ---
; Numero d'axe SDL, a partir de 0 (-1 = non affecte).
brake_axis=2
; Valeur brute a une butee (pedale : repos ou enfoncee selon l'appareil).
brake_min=-32768
; Valeur brute au centre : ignoree pour une pedale.
brake_center=0
; Valeur brute a l'autre butee.
brake_max=32767
; 1 = inverser le sens (pedales G29 : 1, elles valent 32767 au repos).
brake_invert=1
; Zone morte : part de la course ignoree (0 a 0.4).
brake_deadzone=0.015000
; Courbe de reponse : 1 = lineaire, >1 = plus doux au debut, <1 = plus vif (0.2 a 5).
brake_gamma=1.000000

; --- Embrayage : 0 = relache, 1 = enfonce (transmission coupee) ---
; Numero d'axe SDL, a partir de 0 (-1 = non affecte).
clutch_axis=3
; Valeur brute a une butee (pedale : repos ou enfoncee selon l'appareil).
clutch_min=-32768
; Valeur brute au centre : ignoree pour une pedale.
clutch_center=0
; Valeur brute a l'autre butee.
clutch_max=32767
; 1 = inverser le sens (pedales G29 : 1, elles valent 32767 au repos).
clutch_invert=1
; Zone morte : part de la course ignoree (0 a 0.4).
clutch_deadzone=0.015000
; Courbe de reponse : 1 = lineaire, >1 = plus doux au debut, <1 = plus vif (0.2 a 5).
clutch_gamma=1.000000

; --- Frein a main analogique (optionnel, en plus de handbrake_button) ---
; Numero d'axe SDL, a partir de 0 (-1 = non affecte).
handbrake_axis=3
; Valeur brute a une butee (pedale : repos ou enfoncee selon l'appareil).
handbrake_min=-32768
; Valeur brute au centre : ignoree pour une pedale.
handbrake_center=0
; Valeur brute a l'autre butee.
handbrake_max=32767
; 1 = inverser le sens (pedales G29 : 1, elles valent 32767 au repos).
handbrake_invert=0
; Zone morte : part de la course ignoree (0 a 0.4).
handbrake_deadzone=0.015000
; Courbe de reponse : 1 = lineaire, >1 = plus doux au debut, <1 = plus vif (0.2 a 5).
handbrake_gamma=1.000000

; ---------------------------------------------------------------------
; BOUTONS
; Numeros de bouton SDL a partir de 0 ; -1 = non affecte.
; ---------------------------------------------------------------------
; Shifter, position 1 : rapport 1.
gear1_button=12
; Shifter, position 2 : rapport 2.
gear2_button=13
; Shifter, position 3 : rapport 3.
gear3_button=14
; Shifter, position 4 : rapport 4.
gear4_button=15
; Shifter, position 5 : rapport 5.
gear5_button=16
; Shifter, position 6 : marche arriere (la marche arriere physique n'est pas utilisee).
gear6_button=17
; Bouton du frein a main, lu sur l'appareil handbrake_device.
handbrake_button=2

; ---------------------------------------------------------------------
; DIRECTION
; ---------------------------------------------------------------------
; Plage reglee dans le pilote du volant (G HUB), en degres de butee a butee.
hardware_rotation=900
; Plage utilisee en jeu (180 a 2520). Plus courte que hardware_rotation :
; une butee logicielle est ajoutee par le retour de force.
rotation=900
; Braquage maximal des roues avant, en degres par cote (10 a 45).
steering_lock=35

; ---------------------------------------------------------------------
; RETOUR DE FORCE
; ---------------------------------------------------------------------
; 1 = inverser le sens du retour de force (le volant pousse du mauvais cote).
ffb_invert=0
; Force globale (0 a 1.5, compression douce au-dessus de 1). Trop mou : augmenter.
ffb_gain=0.8
; Lissage du couple, 1 = aucun (0.05 a 1). A-coups : diminuer ; retard : augmenter.
ffb_filter=0.7
; Bosses, compression des suspensions, herbe et sable (0 a 1).
ffb_road=0.25
; Compensation de la zone morte du moteur (0 a 0.25). Centre mort : 0.10 a 0.12.
ffb_minimum=0.08
; Amortisseur (0 a 1). Oscillations en lachant le volant : augmenter.
ffb_damping=0.12
; Frottement des pneus a l'arret, s'efface vers 30 km/h (0 a 1).
ffb_friction=0.15
; Poids conserve a la limite d'adherence (0 a 2). Allegement trop brutal : 0.4 a 0.6.
ffb_caster=0.25
; Rappel vers le centre independant de la vitesse (0 a 1).
ffb_self_center=0.08
; Transfert de charge : direction plus lourde au freinage (0 a 1, 0 = desactive).
ffb_load=0.5
; Debut de la compression douce (0.3 a 1). CLIP frequent : baisser d'abord ffb_gain.
ffb_knee=0.75
; 1 = afficher FFB (niveau), GRIP (glissement avant, 100 = limite) et CLIP a l'ecran.
ffb_hud=1
; 1 = ecrire ffb_telemetry.csv dans le dossier du jeu (20 minutes au plus).
ffb_log=0

; ---------------------------------------------------------------------
; FREIN A MAIN (axe analogique)
; ---------------------------------------------------------------------
; Course a partir de laquelle le frein a main serre (effet Triangle), 0.05 a 1.
handbrake_on=0.3
; Course sous laquelle il se relache ; inferieure a handbrake_on (hysteresis).
handbrake_off=0.2

; ---------------------------------------------------------------------
; EMBRAYAGE ET BOITE DE VITESSES
; ---------------------------------------------------------------------
; 1 = embrayage assiste (la pedale reste prioritaire), 0 = manuel.
assisted_clutch=0
; 1 = burnout Driver (Circle) en premiere, au-dela de 97 % d'accelerateur.
driver_burnout=1
; Course d'embrayage ou la transmission est coupee et le passage autorise (0.1 a 0.95).
clutch_bite=0.65
; Zone de patinage sous clutch_bite (0.05 a 0.6). En dessous de
; clutch_bite - clutch_window, l'embrayage transmet tout.
clutch_window=0.3
; Delai en secondes pendant lequel un rapport est encore accepte apres
; avoir debraye (0 a 1). Passages rapides refuses (CLUTCH!) : augmenter.
shift_window=0.35
; 1 = etagement calcule pour chaque voiture : la 5e atteint sa vitesse de
; pointe d'origine sous le limiteur. 0 = utiliser final_drive et tyre_radius.
auto_gearing=1
; Part de la demultiplication transmise aux roues (0 a 1). 0 = poussee
; constante d'origine dans tous les rapports ; 0.7 = reprises plus franches.
gear_torque=0.5
; Rapport de pont, utilise seulement avec auto_gearing=0 (1 a 8).
final_drive=3.7
; Rayon de roue en metres, utilise seulement avec auto_gearing=0 (0.2 a 0.6).
tyre_radius=0.34
; Regime de ralenti en tr/min (600 a 1500).
idle_rpm=850
; Regime maxi en tr/min, debut du limiteur (3000 a 10000).
redline_rpm=6500
; Rapports de boite (0.3 a 6). Avec auto_gearing=1, seuls les ecarts entre
; eux comptent : la 5e est toujours calee sur la vitesse de pointe.
; Marche arriere.
ratio0=3.3
; Rapport de la 1re.
ratio1=3.3
; Rapport de la 2e.
ratio2=2.1
; Rapport de la 3e.
ratio3=1.5
; Rapport de la 4e.
ratio4=1.15
; Rapport de la 5e.
ratio5=0.9
