# REDRIVER2 - virtual reality (OpenXR). Read at game start; the seat_* lines are rewritten
# when the seat is adjusted with the numeric keypad in game.
#
# In game:  Ctrl+Shift+V  back to the flat screen (press again to return to VR)
#           F9            recentre the view (or a long press on the headset button)
#           Keypad 8/2    seat forward/back    4/6 left/right    9/3 up/down    5 reset
[vr]
launcher=1                 # 1 = ask "flat screen or VR" at start (-vr / -flat skip the question)
resolution_scale=1.0       # x the runtime's recommended eye resolution (0.5 .. 2)
horizon_lock=1.0           # 1 = horizon stays level in the cockpit (comfort), 0 = view rolls with the car
units_per_metre=135        # game units per metre; 0 = scale of each car's imported cockpit
world_scale=1.0            # >1 makes the world feel bigger, <1 smaller
hide_wheel=0               # 1 = hide the virtual steering wheel and the driver's arms
map_on_dashboard=1         # minimap on a satnav screen on the dashboard (cockpit view)
recenter_button=-1         # wheel button index that recentres the view (-1 = none)
hud_distance=2.6           # damage/felony bars: panel distance (m)
hud_width=2.6              # panel width (m)
hud_height=0.05            # panel height above the eyes (m)
cinema_distance=2.6        # menus, cutscenes and replays: virtual screen distance (m)
cinema_width=3.4           # virtual screen width (m)
scr_z=90                   # projection distance used to draw a wide frustum (64..256)
near_plane=0.03            # metres
perf_log=1                 # 1 = timing line ("VR: perf ...") in REDRIVER2.log every 5 s
seat_x=0.000
seat_y=0.000
seat_z=0.000
