# Prototype cockpit, loaded on game startup. Family: 0 two-seat, 1 four-seat, 2 truck.
# Units are Driver model units. X right, Y up, Z forward, origin = model center.
[cockpit]
enabled=1
driver=1
pitch=8
fit_model=1
start_in_cockpit=1
# Imported interiors from data/cockpits/<name>.rdc (tools/cockpit/convert_cockpit.py).
# "none" keeps the code-generated cabin. Per-vehicle "interior=" overrides these.
interior_twoseat=duke69
interior_fourseat=canyon75
interior_truck=bokaroo67
# Driver's stature in metres; the seated eye height follows it (Tanner: 1.80).
driver_height=1.80

# Overrides use the city and original model ID, never the resident memory slot.
# Chicago's truck is explicitly identified in the game's car selector.
[CHICAGO.11]
family=2

# The secret Vegas Ranchero is a two-seat pickup.
[VEGAS.12]
family=0
interior=elalamo78

# Other models use a size heuristic initially. Override family after checking
# the vehicle in game: collision dimensions cannot reliably count seats.
# Example (uncomment and replace the city/model number):
# [HAVANA.1]
# family=0
# half_width=130
# half_height=85
# half_length=370
# interior=duke69
# interior_scale=105
# interior_x=0
# interior_y=0
# interior_z=0
# driver_height=1.80
# eye_x=-40
# eye_y=65
# eye_z=-30
# wheel_x=-40
# wheel_y=20
# wheel_z=27
# wheel_radius=22
# wheel_tilt=20
